name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v" prefix (e.g. 2.8.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  tests:
    uses: './.github/workflows/ci.yml'
    with:
      event_name: ${{ github.event_name }}
      repo_full_name: ${{ github.repository }}
  release:
    runs-on: ubuntu-latest
    needs: [ tests ]
    permissions:
      contents: write
      actions: write

    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-b[0-9]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected X.Y.Z or X.Y.Z-bN without 'v' prefix"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Bump version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python release.py "$VERSION"

      - name: Push commit and tag
        run: git push --atomic origin HEAD "v$VERSION"

      # Tags pushed with GITHUB_TOKEN don't trigger workflows, so publish is dispatched explicitly
      - name: Trigger publish
        run: gh workflow run publish.yml --ref "v$VERSION"
