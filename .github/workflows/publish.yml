name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Validate ref
        env:
          REF: ${{ github.ref }}
        run: |
          if ! [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-b[0-9]+)?$ ]]; then
            echo "::error::Invalid ref '$REF'. Publish must run on a release tag vX.Y.Z or vX.Y.Z-bN"
            exit 1
          fi

      - name: Clone project
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 100

      - name: Fetch tags
        run: git fetch --prune --unshallow --tags

      - name: Generate Changelog
        id: changelog
        run: python changelog.py >> CHANGELOG.md

      - name: Build ZIP
        run: python build.py -r

      - name: Create GitHub release
        run: |
          if [[ "${{github.ref_name}}" == *"-b"* ]]; then
            gh release create ${{github.ref_name}} \
              --verify-tag \
              --prerelease \
              -F CHANGELOG.md \
              releases/${{github.ref_name}}/DisenchantBuddy-${{github.ref_name}}.zip \
              releases/${{github.ref_name}}/release.json
          else
            gh release create ${{github.ref_name}} \
              --verify-tag \
              -F CHANGELOG.md \
              releases/${{github.ref_name}}/DisenchantBuddy-${{github.ref_name}}.zip \
              releases/${{github.ref_name}}/release.json
          fi

      - name: Upload CurseForge
        run: sh upload-cf.sh ${{github.ref_name}}

      - name: Upload WAGO
        run: sh upload-wago.sh ${{github.ref_name}}
